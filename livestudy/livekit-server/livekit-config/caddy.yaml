logging:
  logs:
    default:
      level: INFO

storage:
  module: file_system
  root: /data

apps:
  tls:
    certificates:
      automate:
        - live-study.com
        - api.live-study.com

  http:
    servers:
      redirect:  # ← HTTP 80 리디렉션 서버
        listen:
          - ":80"
        routes:
          - match:
              - host:
                  - live-study.com
                  - api.live-study.com
            handle:
              - handler: static_response
                status_code: 308
                headers:
                  Location: ["https://{http.request.host}{uri}"]

      main:  # ← HTTPS 443 서버
        listen:
          - ":443"
        routes:
          - match:
              - host:
                  - live-study.com
            handle:
              - handler: reverse_proxy
                upstreams:
                  - dial: 127.0.0.1:7880
                transport:
                  protocol: http
                headers:
                  request:
                    set:
                      Connection: ["{>Connection}"]
                      Upgrade: ["{>Upgrade}"]
          - match:
              - host:
                  - api.live-study.com
            handle:
              - handler: reverse_proxy
                upstreams:
                  - dial: 127.0.0.1:8080
                transport:
                  protocol: http
                headers:
                  request:
                    set:
                      Connection: ["{>Connection}"]
                      Upgrade: ["{>Upgrade}"]

