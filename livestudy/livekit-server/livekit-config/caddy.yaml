logging:
  logs:
    default:
      level: INFO

storage:
  module: file_system
  root: /data

apps:
  tls:
    certificates:
      automate:
        - live-study.com
        - api.live-study.com

  http:
    servers:
      redirect:
        listen:
          - ":80"
        routes:
          - match:
              - host:
                  - live-study.com
                  - api.live-study.com
            handle:
              - handler: static_response
                status_code: 308
                headers:
                  Location: ["https://{http.request.host}{uri}"]

      main:
        listen:
          - ":443"
        routes:
          # 1. LiveKit /rtc → 7880
          - match:
              - host:
                  - api.live-study.com
                path:
                  - /rtc*
            handle:
              - handler: reverse_proxy
                upstreams:
                  - dial: 127.0.0.1:7880
                transport:
                  protocol: http
                headers:
                  request:
                    set:
                      Connection: ["{>Connection}"]
                      Upgrade: ["{>Upgrade}"]

          # 2. STOMP /ws → 8080 (Spring)
          - match:
              - host:
                  - api.live-study.com
                path:
                  - /ws*
            handle:
              - handler: reverse_proxy
                upstreams:
                  - dial: 127.0.0.1:8080
                transport:
                  protocol: http
                headers:
                  request:
                    set:
                      Connection: ["{>Connection}"]
                      Upgrade: ["{>Upgrade}"]

          # 3. 기타 API → 8080 (Spring)
          - match:
              - host:
                  - api.live-study.com
            handle:
              - handler: reverse_proxy
                upstreams:
                  - dial: 127.0.0.1:8080
