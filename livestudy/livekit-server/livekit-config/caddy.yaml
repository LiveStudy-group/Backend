apps:
  http:
    servers:
      main:
        listen:
          - ":443"
        routes:
          - match:
              - host:
                  - live-study.com
            handle:
              - handler: reverse_proxy
                upstreams:
                  - dial: spring:8080    # localhost → spring 으로 변경
          - match:
              - host:
                  - api.live-study.com
            handle:
              - handler: reverse_proxy
                upstreams:
                  - dial: spring:8080    # api.live-study.com 도 spring 으로 변경
                transport:
                  protocol: http
