logging:
  logs:
    default:
      level: INFO

storage:
  module: file_system
  root: /data

apps:
  tls:
    certificates:
      automate:
        - live-study.com # FE
        - api.live-study.com # BE

  http:
    servers:
      redirect:
        listen:
          - ":80"
        routes:
          - match:
              - host:
                  - live-study.com
                  - api.live-study.com
            handle:
              - handler: static_response
                status_code: 308
                headers:
                  Location: ["https://{http.request.host}{uri}"]

      main:
        listen:
          - ":443"
        routes:
          # 1. LiveKit /rtc → 7880
          - match:
              - host:
                  - live-study.com
                path:
                  - /rtc*
            handle:
              - handler: reverse_proxy
                upstreams:
                  - dial: 127.0.0.1:7880
                headers:
                  response:
                    set:
                      Access-Control-Allow-Origin: [ "{http.request.header.Origin}" ]
                      Access-Control-Allow-Credentials: [ "true" ]
                      Access-Control-Allow-Methods: [ "GET, POST, PUT, DELETE, PATCH, OPTIONS" ]
                      Access-Control-Allow-Headers: [ "Content-Type, Authorization" ]

          # 2. STOMP /ws → 8080 (Spring)
          - match:
              - host:
                  - api.live-study.com
                path:
                  - /ws*
            handle:
              - handler: reverse_proxy
                upstreams:
                  - dial: 127.0.0.1:8080
                headers:
                  response:
                    set:
                      Access-Control-Allow-Origin: [ "{http.request.header.Origin}" ]
                      Access-Control-Allow-Credentials: [ "true" ]
                      Access-Control-Allow-Methods: [ "GET, POST, PUT, DELETE, PATCH, OPTIONS" ]
                      Access-Control-Allow-Headers: [ "Content-Type, Authorization" ]


          # 3. 기타 API → 8080 (Spring)
          - match:
              - host:
                  - api.live-study.com
            handle:
              - handler: reverse_proxy
                upstreams:
                  - dial: 127.0.0.1:8080
